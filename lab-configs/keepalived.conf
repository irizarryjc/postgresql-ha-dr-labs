# Keepalived VRRP template for a redundant client VIP (<vip_address>).
# Repository: https://github.com/irizarryjc/postgresql-ha-dr-labs
#
# Deploy on both routing nodes (<router1_host> and <router2_host>).
# On <router1_host>: priority 105, unicast_src_ip <router1_host>, peer <router2_host>
# On <router2_host>: priority 100, unicast_src_ip <router2_host>, peer <router1_host>
#
# Both nodes track PgBouncer AND HAProxy so the VIP moves if either tier stops.
# Replace all <placeholder> values before starting keepalived.service.

global_defs {
    router_id PG_ROUTER_1
    enable_script_security
    script_user keepalived_script
}

vrrp_script chk_pg_routing {
    script "/usr/local/bin/check_pg_routing.sh"
    interval 2
    timeout 2
    weight -20
    fall 2
    rise 2
}

# Example /usr/local/bin/check_pg_routing.sh (chmod 0755):
#   #!/bin/sh
#   pidof pgbouncer >/dev/null 2>&1 && pidof haproxy >/dev/null 2>&1

vrrp_instance VI_PG_CLIENT {
    state BACKUP
    nopreempt
    interface <network_interface>
    virtual_router_id 51
    priority 105
    advert_int 1

    unicast_src_ip <router1_host>
    unicast_peer {
        <router2_host>
    }

    # VRRP v2 PASS uses at most 8 characters; omit authentication on VRRP v3.
    authentication {
        auth_type PASS
        auth_pass <vrrp_auth_password>
    }

    track_script {
        chk_pg_routing
    }

    virtual_ipaddress {
        <vip_address>/24 dev <network_interface>
    }
}
