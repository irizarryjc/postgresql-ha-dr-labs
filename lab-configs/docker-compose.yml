# Companion lab starter topology for PostgreSQL 17 HA/DR exercises.
# Repository: https://github.com/irizarryjc/postgresql-ha-dr-labs
#
# LAB ONLY: Supply secrets via an untracked .env file or shell exports:
#   export PG_SUPERUSER_PASSWORD="<superuser_password>"
#   export PG_REPL_PASSWORD="<repl_password>"
#
# Note: Docker Compose is convenient for Chapter 2 smoke checks and Chapter 5
# streaming replication exercises. Use 3-4 Linux VMs for full Patroni crash,
# keepalived VRRP VIP (Lab L7), and remote-site DR drills (Labs L9-L10).

networks:
  pg_ha_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  pg_primary_data:
  pg_standby_data:
  pg_replica2_data:
  pg_repo_data:

services:
  etcd1:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: lab-dcs1
    hostname: dcs1
    command:
      - /usr/local/bin/etcd
      - --name=dcs1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.28.0.11:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://172.28.0.11:2380
      - --initial-cluster=dcs1=http://172.28.0.11:2380,dcs2=http://172.28.0.12:2380,dcs3=http://172.28.0.13:2380
      - --initial-cluster-token=pg-ha-lab-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd1_data:/etcd-data
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.11

  etcd2:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: lab-dcs2
    hostname: dcs2
    command:
      - /usr/local/bin/etcd
      - --name=dcs2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.28.0.12:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://172.28.0.12:2380
      - --initial-cluster=dcs1=http://172.28.0.11:2380,dcs2=http://172.28.0.12:2380,dcs3=http://172.28.0.13:2380
      - --initial-cluster-token=pg-ha-lab-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd2_data:/etcd-data
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.12

  etcd3:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: lab-dcs3
    hostname: dcs3
    command:
      - /usr/local/bin/etcd
      - --name=dcs3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://172.28.0.13:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://172.28.0.13:2380
      - --initial-cluster=dcs1=http://172.28.0.11:2380,dcs2=http://172.28.0.12:2380,dcs3=http://172.28.0.13:2380
      - --initial-cluster-token=pg-ha-lab-etcd
      - --initial-cluster-state=new
    volumes:
      - etcd3_data:/etcd-data
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.13

  pg-primary:
    image: postgres:17
    container_name: lab-pg-primary
    hostname: pg-primary
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in .env}"
      POSTGRES_DB: appdb
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_log_hints=on
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.21

  pg-standby:
    image: postgres:17
    container_name: lab-pg-standby
    hostname: pg-standby
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.22

  pg-replica2:
    image: postgres:17
    container_name: lab-pg-replica2
    hostname: pg-replica2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PG_SUPERUSER_PASSWORD:?Set PG_SUPERUSER_PASSWORD in .env}"
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8 --auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:54323:5432"
    volumes:
      - pg_replica2_data:/var/lib/postgresql/data
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.23

  pg-repo:
    image: debian:bookworm-slim
    container_name: lab-pg-repo
    hostname: pg-repo
    command: ["sleep", "infinity"]
    volumes:
      - pg_repo_data:/var/lib/pgbackrest
    networks:
      pg_ha_net:
        ipv4_address: 172.28.0.30
