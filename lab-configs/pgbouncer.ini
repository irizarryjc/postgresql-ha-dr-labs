; PgBouncer template for the client routing tier (Chapters 2 & 8).
; Repository: https://github.com/irizarryjc/postgresql-ha-dr-labs
;
; Routing topology:
;   App -> keepalived VIP (<vip_address>:6432)
;       -> PgBouncer (pooling)
;       -> HAProxy (127.0.0.1:5000 primary / 127.0.0.1:5001 replica)
;       -> Patroni-managed PostgreSQL nodes
;
; IMPORTANT: PgBouncer does NOT detect failover. After switchover or failover,
; run RECONNECT on the pgbouncer admin console (in addition to HAProxy's
; on-marked-down shutdown-sessions) so pooled server connections re-establish
; against the new primary.
;
; Alternative layout (see Chapter 8): run a per-node PgBouncer co-located on
; each database node behind HAProxy when pooling needs to scale horizontally
; with database hosts.

[databases]
<app_name> = host=127.0.0.1 port=5000 dbname=<app_name>
<app_name>_ro = host=127.0.0.1 port=5001 dbname=<app_name>

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir = /var/run/postgresql

; Store SCRAM-SHA-256 hashes (not plaintext passwords) in userlist.txt
; with 0600 ownership for the pgbouncer service account.
; Alternatively configure auth_user and auth_query with <pgbouncer_password>.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
reserve_pool_size = 5
reserve_pool_timeout = 3

; Protocol-level prepared statement tracking in transaction mode (PgBouncer 1.21.0+)
max_prepared_statements = 100

; Note: server_reset_query is ignored in transaction pool mode unless
; server_reset_query_always = 1 is also enabled.
server_reset_query = DISCARD ALL
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 5
query_wait_timeout = 30

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
ignore_startup_parameters = extra_float_digits
