# pgBackRest configuration templates for a dedicated repository host (<repo_host>)
# and PostgreSQL 17 database nodes (Chapters 9 & 10).
# Repository: https://github.com/irizarryjc/postgresql-ha-dr-labs
#
# Copy the appropriate section into /etc/pgbackrest/pgbackrest.conf (chmod 0640)
# on each host and replace all <placeholder> values before running stanza-create.
#
# =============================================================================
# PART A: Dedicated Repository Host (<repo_host>) - /etc/pgbackrest/pgbackrest.conf
# =============================================================================

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=4
repo1-bundle=y
repo1-block=y
compress-type=zst
process-max=2
start-fast=y
backup-standby=y
log-level-console=info
log-level-file=detail
# Optional repository encryption (do not commit real passphrases):
# repo1-cipher-type=aes-256-cbc
# repo1-cipher-pass=<backup_password>

[<stanza_name>]
pg1-host=<primary_host>
pg1-host-user=postgres
pg1-path=/var/lib/postgresql/17/data
pg1-port=5432

pg2-host=<standby_host>
pg2-host-user=postgres
pg2-path=/var/lib/postgresql/17/data
pg2-port=5432

# =============================================================================
# PART B: Database Node (<primary_host> / <standby_host>) Reference Snippet
# Place ONLY the snippet below on PostgreSQL nodes (uncomment when deploying):
# =============================================================================
# [global]
# repo1-host=<repo_host>
# repo1-host-user=pgbackrest
# archive-async=y
# spool-path=/var/spool/pgbackrest
# log-level-console=info
# log-level-file=detail
#
# [<stanza_name>]
# pg1-path=/var/lib/postgresql/17/data
# pg1-port=5432
