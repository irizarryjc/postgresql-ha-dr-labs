# HAProxy 2.8+ template for Patroni primary and replica routing.
# Repository: https://github.com/irizarryjc/postgresql-ha-dr-labs
#
# Routing topology (Chapters 2 & 8):
#   App -> keepalived VIP (<vip_address>)
#       -> PgBouncer (:6432)
#       -> HAProxy (127.0.0.1:5000 primary / 127.0.0.1:5001 replica)
#       -> PostgreSQL nodes (:5432), health-checked via Patroni REST (:8008)
#
# Validate before reload: haproxy -c -f /etc/haproxy/haproxy.cfg

global
    maxconn 1000
    log /dev/log local0 info
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind 127.0.0.1:7000
    stats enable
    stats uri /stats
    stats refresh 5s

listen postgres_primary
    bind 127.0.0.1:5000
    option httpchk
    http-check connect port 8008
    http-check send meth GET uri /primary ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node1 <primary_host>:5432 maxconn 200 check port 8008
    server pg-node2 <standby_host>:5432 maxconn 200 check port 8008
    server pg-node3 <replica2_host>:5432 maxconn 200 check port 8008

listen postgres_replica
    bind 127.0.0.1:5001
    balance leastconn
    option httpchk
    http-check connect port 8008
    http-check send meth GET uri /replica ver HTTP/1.1 hdr Host patroni
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg-node1 <primary_host>:5432 maxconn 200 check port 8008
    server pg-node2 <standby_host>:5432 maxconn 200 check port 8008
    server pg-node3 <replica2_host>:5432 maxconn 200 check port 8008
